# Navigation Links
#   To link a page section, specify the URL as a hash `/#` followed by the `id` of the section.
#   The `weight` parameter defines the order that the links will appear in.

main:
  - name: Home
    url: /#top
    weight: 10
  - name: Services
    url: /#services
    weight: 20
  - name: Projects
    url: /#projects
    weight: 30
  - name: About
    url: about/
    weight: 40
  - name: Contact
    url: /contact/
    weight: 50

# Footer links (4-column layout)
#   Top-level items become column headings, children become links.
footer:
  - name: Services
    weight: 10
  - parent: Services
    name: Cloud Migration and Legacy Integration
    url: /#services
    weight: 10
  - parent: Services
    name: Analytics and Data Visualization
    url: /#services
    weight: 20
  - parent: Services
    name: AI Integration and Strategy
    url: /#services
    weight: 30

  - name: Company
    weight: 20
  - parent: Company
    name: About
    url: about/
    weight: 10
  - parent: Company
    name: Projects
    url: /#projects
    weight: 20
  - parent: Company
    name: Contact
    url: /contact/
    weight: 30
